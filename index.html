<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Elegance | Exclusividad</title>
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: #121216;
            --accent-color: #d4af37; /* Tono dorado sutil o cambia a #ff2a6d para neón */
            --text-main: #f1f1f1;
            --text-muted: #888898;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
        }

        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        h1 {
            font-size: 1.4rem;
            margin: 10px 0 5px;
            letter-spacing: 2px;
            font-weight: 400;
            text-transform: uppercase;
        }

        p.bio {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin-bottom: 12px;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--text-main);
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <!-- Imagen de perfil con estética dark -->
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=300&auto=format&fit=crop" alt="Avatar" class="avatar">
            
            <h1>TRoxy Venom</h1>
            <p class="bio">
                Deseo, código y misterio en la penumbra. <br>
                Experiencias exclusivas y alta distinción.
            </p>

            <!-- Botones de Enlace -->
            <a href="https://t.me/TRoxyVenomT" class="btn">💬 Contacto Directo</a>
            <a href="https://t.me/+1sOeEuuEQdc0ZDlh" class="btn">✦ Canal Privado</a>

            <div class="footer">
                Secured by AEGIS Protocol
            </div>
        </div>
    </div>

</body>
</html>
